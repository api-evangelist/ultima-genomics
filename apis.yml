aid: ultima-genomics
name: Ultima Genomics
description: 'Ultima Genomics is a genomics technology company that develops high-throughput,
  cost-effective DNA sequencing platforms and solutions, led by its UG200 Series sequencer
  aimed at population-scale genomics. Its platform spans germline sequencing, oncology,
  single-cell analysis, proteomics, and epigenomics, paired with library-preparation
  workflows and bioinformatics tooling. The company does not operate a hosted developer
  REST API or SDK; its programmatic surface is open-source bioinformatics tools and
  WDL pipelines published on GitHub, including workflows compatible with AWS HealthOmics.
  Added to the API Evangelist network via the Lightspeed Venture Partners portfolio.'
